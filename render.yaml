# Render blueprint — creates the Cleanly backend with one click.
# In Render: New → Blueprint → point it at your GitHub repo.
services:
  - type: web
    name: cleanly
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_USE_API
        value: "true"
      # Web build is served from the same origin as the API → keep base empty here.
      - key: VITE_API_BASE
        value: ""
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false   # paste your Supabase connection string in the Render dashboard
      - key: BARION_ENV
        value: test
      - key: BARION_POSKEY
        sync: false
      - key: BARION_PAYEE
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false   # set to https://<your-app>.onrender.com after first deploy
      # ── Phone verification (Twilio Verify) — set these three in the Render
      #    dashboard to switch SMS/WhatsApp codes on. Never commit real values.
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_VERIFY_SID
        sync: false
      # ── Transactional email (Resend) — approval emails, password reset, email codes
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # ── Payments / platform
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: COMMISSION_PCT
        value: "10"
      # ── Real push notifications (Firebase) — base64 of the service-account JSON
      - key: FIREBASE_SERVICE_ACCOUNT_B64
        sync: false
