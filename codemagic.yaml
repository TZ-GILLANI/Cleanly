# Codemagic cloud build — builds the iOS app WITHOUT a Mac and can submit
# straight to App Store Connect. Connect this repo at codemagic.io,
# then add the App Store Connect integration + iOS certificate in the UI
# (Teams → Integrations → App Store Connect; Code signing identities).
workflows:
  ios-appstore:
    name: Cleano iOS (App Store)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic   # name of your App Store Connect API key in Codemagic
    environment:
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: npm ci || npm install
      - name: Build web bundle (API mode)
        script: npm run build
      - name: Add & sync iOS platform
        script: |
          npx cap add ios || true
          npx cap sync ios
      - name: Firebase iOS config
        script: |
          cp ios-config/GoogleService-Info.plist ios/App/App/GoogleService-Info.plist
      - name: App icon
        script: |
          cp -f ios-config/AppIcon.appiconset/* "ios/App/App/Assets.xcassets/AppIcon.appiconset/"
      - name: iOS permission strings
        script: |
          P=ios/App/App/Info.plist
          plutil -replace NSLocationWhenInUseUsageDescription -string "Cleano uses your location to fill in your address when booking a cleaning." $P
          plutil -replace NSCameraUsageDescription -string "Cleano uses the camera so you can photograph your documents, such as a student card or company papers." $P
          plutil -replace NSPhotoLibraryUsageDescription -string "Cleano lets you attach photos of your documents from your photo library." $P
          plutil -replace NSPhotoLibraryAddUsageDescription -string "Cleano can save images to your photo library." $P
          # Apple requires an encryption-usage declaration for every upload; Cleano uses only standard HTTPS (exempt)
          plutil -replace ITSAppUsesNonExemptEncryption -bool NO $P
      - name: Enable push notifications capability
        script: |
          cp ios-config/App.entitlements ios/App/App/App.entitlements
      - name: Wire Firebase + push into the iOS project
        script: |
          set -e
          # a) initialise Firebase at app launch (AppDelegate.swift)
          perl -0pi -e 's/import Capacitor/import Capacitor\nimport FirebaseCore/ unless /FirebaseCore/' ios/App/App/AppDelegate.swift
          perl -0pi -e 's/(didFinishLaunchingWithOptions[^\n]*-> Bool \{)/$1\n        FirebaseApp.configure()/ unless /FirebaseApp.configure/' ios/App/App/AppDelegate.swift
          echo "--- AppDelegate.swift ---"; head -20 ios/App/App/AppDelegate.swift
          # b) allow background push delivery
          plutil -replace UIBackgroundModes -json '["remote-notification"]' ios/App/App/Info.plist || plutil -insert UIBackgroundModes -json '["remote-notification"]' ios/App/App/Info.plist
          # c) link the push entitlements file into the App target build settings
          gem list -i xcodeproj >/dev/null 2>&1 || gem install xcodeproj --no-document || sudo gem install xcodeproj --no-document
          ruby -e "require 'xcodeproj'; pr=Xcodeproj::Project.open('ios/App/App.xcodeproj'); app=pr.targets.find{|t| t.name=='App'}; app.build_configurations.each{|c| c.build_settings['CODE_SIGN_ENTITLEMENTS']='App/App.entitlements'}; grp=pr.main_group.find_subpath('App', true); unless app.resources_build_phase.files_references.any?{|f| f.display_name=='GoogleService-Info.plist'}; ref=grp.new_reference('GoogleService-Info.plist'); app.add_resources([ref]); end; pr.save; puts 'entitlements + GoogleService-Info.plist wired into bundle'"
      - name: Install CocoaPods
        script: cd ios/App && pod install
      - name: Set a fresh build number
        script: |
          # every App Store upload needs a higher build number than the last one
          LATEST=$(app-store-connect get-latest-testflight-build-number 6793626875 2>/dev/null || echo 0)
          case "$LATEST" in ''|*[!0-9]*) LATEST=0 ;; esac
          NEXT=$((LATEST + 1))
          cd ios/App && agvtool new-version -all "$NEXT"
          echo "Build number set to $NEXT"
      - name: Build & sign IPA (App Store distribution)
        script: |
          set -e
          keychain initialize
          # Generate our OWN signing private key, so the certificate can be created AND saved
          # (fixes "Cannot save Signing Certificates without certificate private key").
          openssl genrsa -out /tmp/dist_key.pem 2048
          # Free the slot: Apple caps distribution certs at 2. List ALL certificates
          # (no type filter — catches both DISTRIBUTION and IOS_DISTRIBUTION) and delete them.
          # They are orphans from earlier CI runs; we hold no usable private key for them.
          app-store-connect certificates list --json > /tmp/certs.json 2>/dev/null || echo "[]" > /tmp/certs.json
          echo "Existing certificates:"; cat /tmp/certs.json | python3 -c "import sys,json;[print(' -',c.get('id'),c.get('attributes',{}).get('certificateType')) for c in json.load(sys.stdin)]" 2>/dev/null || true
          for cid in $(python3 -c "import json;print(' '.join(c['id'] for c in json.load(open('/tmp/certs.json'))))" 2>/dev/null); do
            echo "Deleting certificate $cid"
            app-store-connect certificates delete "$cid" --yes 2>&1 || app-store-connect certificates delete "$cid" 2>&1 || true
          done
          sleep 4
          # Create the distribution certificate (with our key) + App Store profile
          app-store-connect fetch-signing-files "com.cleano.app" \
            --type IOS_APP_STORE \
            --certificate-key @file:/tmp/dist_key.pem \
            --create \
            --verbose
          keychain add-certificates
          xcode-project use-profiles --verbose
          xcode-project build-ipa --workspace ios/App/App.xcworkspace --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false   # just upload; manage TestFlight/submission from the App Store Connect UI

  android-playstore:
    name: Cleano Android (Play Store bundle)
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      node: 20
      java: 17
      # Play Store only accepts SIGNED bundles. Create/generate a keystore in
      # Codemagic → Teams → Code signing identities → Android keystores and give
      # it exactly this reference name.
      android_signing:
        - cleano_keystore
    scripts:
      - name: Install dependencies
        script: npm ci || npm install
      - name: Build web bundle (API mode)
        script: npm run build
      - name: Sync Android
        script: npx cap sync android
      - name: Build release bundle
        script: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
