# Codemagic cloud build — builds the iOS app WITHOUT a Mac and can submit
# straight to App Store Connect. Connect this repo at codemagic.io,
# then add the App Store Connect integration + iOS certificate in the UI
# (Teams → Integrations → App Store Connect; Code signing identities).
workflows:
  ios-appstore:
    name: Cleano iOS (App Store)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic   # name of your App Store Connect API key in Codemagic
    environment:
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: npm ci || npm install
      - name: Build web bundle (API mode)
        script: npm run build
      - name: Add & sync iOS platform
        script: |
          npx cap add ios || true
          npx cap sync ios
      - name: Firebase iOS config
        script: |
          cp ios-config/GoogleService-Info.plist ios/App/App/GoogleService-Info.plist
      - name: iOS permission strings
        script: |
          plutil -replace NSLocationWhenInUseUsageDescription -string "Cleano uses your location to fill in your address when booking a cleaning." ios/App/App/Info.plist
      - name: Enable push notifications capability
        script: |
          cp ios-config/App.entitlements ios/App/App/App.entitlements
      - name: Install CocoaPods
        script: cd ios/App && pod install
      - name: Write App Store Connect API key for Xcode
        script: |
          mkdir -p "$HOME/private_keys"
          KEYFILE="$HOME/private_keys/AuthKey_$APP_STORE_CONNECT_KEY_IDENTIFIER.p8"
          # write the PEM key; convert any escaped \\n into real newlines so Xcode can parse it
          printf '%b' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$KEYFILE"
          if ! head -1 "$KEYFILE" | grep -q "BEGIN"; then
            printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$KEYFILE"
          fi
          echo "key bytes: $(wc -c < "$KEYFILE") | first line: $(head -1 "$KEYFILE")"
      - name: Archive (automatic signing — Xcode creates cert + profile)
        script: |
          KEY="$HOME/private_keys/AuthKey_$APP_STORE_CONNECT_KEY_IDENTIFIER.p8"
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -archivePath build/App.xcarchive \
            -destination 'generic/platform=iOS' \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            DEVELOPMENT_TEAM=DAS6RZC3A8 \
            CODE_SIGN_STYLE=Automatic \
            archive
      - name: Export IPA
        script: |
          KEY="$HOME/private_keys/AuthKey_$APP_STORE_CONNECT_KEY_IDENTIFIER.p8"
          mkdir -p build/ios/ipa
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist ios-config/ExportOptions.plist \
            -exportPath build/ios/ipa \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  android-playstore:
    name: Cleano Android (Play Store bundle)
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      node: 20
      java: 17
    scripts:
      - name: Install dependencies
        script: npm ci || npm install
      - name: Build web bundle (API mode)
        script: npm run build
      - name: Sync Android
        script: npx cap sync android
      - name: Build release bundle
        script: cd android && chmod +x gradlew && ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
