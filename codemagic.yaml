# Codemagic cloud build — builds the iOS app WITHOUT a Mac and can submit
# straight to App Store Connect. Connect this repo at codemagic.io,
# then add the App Store Connect integration + iOS certificate in the UI
# (Teams → Integrations → App Store Connect; Code signing identities).
workflows:
  ios-appstore:
    name: Cleano iOS (App Store)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic   # name of your App Store Connect API key in Codemagic
    environment:
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: npm ci || npm install
      - name: Build web bundle (API mode)
        script: npm run build
      - name: Add & sync iOS platform
        script: |
          npx cap add ios || true
          npx cap sync ios
      - name: Firebase iOS config
        script: |
          cp ios-config/GoogleService-Info.plist ios/App/App/GoogleService-Info.plist
      - name: iOS permission strings
        script: |
          plutil -replace NSLocationWhenInUseUsageDescription -string "Cleano uses your location to fill in your address when booking a cleaning." ios/App/App/Info.plist
      - name: Enable push notifications capability
        script: |
          cp ios-config/App.entitlements ios/App/App/App.entitlements
      - name: Install CocoaPods
        script: cd ios/App && pod install
      - name: Build & sign IPA (App Store distribution)
        script: |
          set -e
          keychain initialize
          # Remove orphaned distribution certificates (created by earlier CI runs, private keys gone).
          # We regenerate a fresh, usable one below — self-cleaning so it works on every build.
          CERT_IDS=$(app-store-connect certificates list --type IOS_DISTRIBUTION --json 2>/dev/null | python3 -c "import sys,json;d=json.load(sys.stdin);print(' '.join(c.get('id','') for c in d))" 2>/dev/null || true)
          for cid in $CERT_IDS; do
            echo "Deleting orphaned distribution certificate $cid"
            app-store-connect certificates delete "$cid" --yes 2>/dev/null || true
          done
          # Create a fresh App Store DISTRIBUTION certificate (new private key) + provisioning profile
          app-store-connect fetch-signing-files "com.cleano.app" \
            --type IOS_APP_STORE \
            --create \
            --verbose
          keychain add-certificates
          # Apply the profile to the project, then archive + export in the same shell
          xcode-project use-profiles --verbose
          xcode-project build-ipa --workspace ios/App/App.xcworkspace --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  android-playstore:
    name: Cleano Android (Play Store bundle)
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      node: 20
      java: 17
    scripts:
      - name: Install dependencies
        script: npm ci || npm install
      - name: Build web bundle (API mode)
        script: npm run build
      - name: Sync Android
        script: npx cap sync android
      - name: Build release bundle
        script: cd android && chmod +x gradlew && ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
